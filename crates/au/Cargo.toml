[package]
name = "muse-au"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Exports a MUSE plugin as an Audio Unit (v2 effect). macOS only."

[dependencies]
muse-core = { path = "../core" }

[dev-dependencies]
muse-gain = { path = "../gain" }
muse-host = { path = "../host" }

[[bin]]
name = "muse-au-verify"
path = "src/bin/verify.rs"
