[package]
name = "ruse-au"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Exports a RUSE plugin as an Audio Unit (v2 effect). macOS only."

[dependencies]
ruse-core = { path = "../core" }

[dev-dependencies]
ruse-gain = { path = "../gain" }
ruse-host = { path = "../host" }

[[bin]]
name = "ruse-au-verify"
path = "src/bin/verify.rs"
