[workspace]
resolver = "2"
members = ["crates/core", "crates/gain", "crates/tape", "crates/host", "crates/mcp", "crates/clap", "crates/au", "crates/blocks", "examples/*", "plugins/*"]

# Plugins name the RUSE crates through these, so the same generated Cargo.toml works here
# and in a workspace made by `ruse-mcp new`, which points them at a RUSE checkout.
[workspace.dependencies]
ruse-core = { path = "crates/core" }
ruse-blocks = { path = "crates/blocks" }
ruse-host = { path = "crates/host" }
ruse-clap = { path = "crates/clap" }
ruse-au = { path = "crates/au" }

# The DSP tests render seconds of audio, so keep them fast.
[profile.dev]
opt-level = 3
