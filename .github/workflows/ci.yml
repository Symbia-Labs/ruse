name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The README's quick start on a clean runner: install ruse-mcp, make a workspace, and build,
  # check, render and package plugins there, the way a new user would.
  quick-start:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Install ruse-mcp
        run: cargo install --path crates/mcp

      - name: Make a workspace
        run: ruse-mcp new "$RUNNER_TEMP/my-plugins"

      - name: Print an agent's setup
        working-directory: ${{ runner.temp }}/my-plugins
        run: |
          ruse-mcp setup claude-desktop | tee "$RUNNER_TEMP/setup.txt"
          grep -qF "$(command -v ruse-mcp)" "$RUNNER_TEMP/setup.txt"
          grep -qF "my-plugins" "$RUNNER_TEMP/setup.txt"

      - name: Try the examples
        working-directory: ${{ runner.temp }}/my-plugins
        run: |
          ruse-mcp call list_plugins
          ruse-mcp call check '{"name":"warm-saturator"}'
          ruse-mcp call render '{"name":"harmonic-eq"}'

      - name: Build a new plugin and package it
        working-directory: ${{ runner.temp }}/my-plugins
        run: |
          ruse-mcp call create_plugin '{"name":"tilt","title":"Tilt","description":"A tilt equalizer.","parameters":[{"id":"tilt","name":"Tilt","description":"Positive brightens, negative darkens.","unit":"dB","min":-6,"max":6,"default":0}],"graph":{"chain":[{"block":"filter","args":{"type":"lowshelf","freq":800,"gain_db":"-tilt"}},{"block":"filter","args":{"type":"highshelf","freq":800,"gain_db":"tilt"}}]}}'
          ruse-mcp call check '{"name":"tilt"}'
          ruse-mcp call package_plugin '{"name":"tilt","vendor":"Quick Start","formats":["au","clap"],"install":true}'

  macos:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # Every example has a gates test, so this also runs the seven gates on each one.
      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build ruse-mcp
        run: cargo build -p ruse-mcp

      # package_plugin builds each bundle, loads it the way a host does and runs the checks
      # (25 for an Audio Unit, 17 for CLAP), then installs it and runs auval on the Audio Unit.
      - name: Package and install the examples
        run: |
          for p in warm-saturator bus-compressor harmonic-eq multiband-compressor ducker ring-mod clean-clipper maximizer de-esser; do
            echo "::group::$p"
            target/debug/ruse-mcp call package_plugin "{\"name\":\"$p\",\"install\":true}"
            echo "::endgroup::"
          done

      - name: Build and install RUSE 808
        run: zsh examples/kit-808-au/bundle.sh

      - name: Validate every Audio Unit with auval
        run: |
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          for codes in "aufx Wsat Symb" "aufx Bcom Symb" "aufx Heqx Symb" "aufx Mbcp Symb" "aufx Duck Symb" "aufx Ring Symb" "aufx Cclp Symb" "aufx Maxi Symb" "aufx Dess Symb" "aumu K808 Symb"; do
            echo "::group::auval -v $codes"
            auval -v $codes | tail -40
            test ${PIPESTATUS[0]} -eq 0
            echo "::endgroup::"
          done
