[package]
name = "plugin-harmonic-eq"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "A parametric equalizer with its bands on the harmonics of one fundamental. Boost, cut or tilt the overtones of a tone, favour the odd or even harmonics, or notch the harmonics of mains hum."
autobins = false

[[bin]]
name = "render-harmonic-eq"
path = "src/bin/render.rs"

[dependencies]
ruse-core = { workspace = true }
ruse-blocks = { workspace = true }
ruse-host = { workspace = true }
