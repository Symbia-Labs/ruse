[package]
name = "plugin-warm-saturator"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Pushes the signal into a soft or hard clipper, then rolls off the highs with a one-pole low-pass."
autobins = false

[[bin]]
name = "render-warm-saturator"
path = "src/bin/render.rs"

[dependencies]
ruse-core = { workspace = true }
ruse-blocks = { workspace = true }
ruse-host = { workspace = true }
